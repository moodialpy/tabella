<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Tabella</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #f5f5f5;
    touch-action: none;
  }
  #viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    position: relative;
  }
  #viewport.dragging {
    cursor: grabbing;
  }
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #stage img {
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  #controls {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  #controls button {
    width: 40px;
    height: 40px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    cursor: pointer;
  }
  #controls button:active {
    background: #eee;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <img id="svgImg" src="tabella.svg" alt="Tabella">
  </div>
</div>

<div id="controls">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="reset">⟳</button>
</div>

<script>
const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
const img = document.getElementById('svgImg');

let scale = 1;
let originX = 0;
let originY = 0;
let isDragging = false;
let startX, startY;

function applyTransform() {
  stage.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
}

function centerImage() {
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const iw = img.naturalWidth || img.clientWidth;
  const ih = img.naturalHeight || img.clientHeight;
  scale = Math.min(vw / iw, vh / ih) * 0.9;
  originX = (vw - iw * scale) / 2;
  originY = (vh - ih * scale) / 2;
  applyTransform();
}

img.addEventListener('load', centerImage);
if (img.complete) centerImage();
window.addEventListener('resize', centerImage);

// Zoom con rotellina (centrato sul cursore)
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const newScale = Math.max(0.01, Math.min(scale * zoomFactor, 100000));

  originX = mouseX - (mouseX - originX) * (newScale / scale);
  originY = mouseY - (mouseY - originY) * (newScale / scale);
  scale = newScale;

  applyTransform();
}, { passive: false });

// Pan con trascinamento del mouse
viewport.addEventListener('mousedown', (e) => {
  isDragging = true;
  viewport.classList.add('dragging');
  startX = e.clientX - originX;
  startY = e.clientY - originY;
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  originX = e.clientX - startX;
  originY = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// Supporto touch: pan a un dito, pinch-zoom a due dita
let lastTouchDist = null;
let lastTouchMid = null;

function getTouchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}
function getTouchMid(touches) {
  return {
    x: (touches[0].clientX + touches[1].clientX) / 2,
    y: (touches[0].clientY + touches[1].clientY) / 2
  };
}

viewport.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - originX;
    startY = e.touches[0].clientY - originY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    lastTouchDist = getTouchDist(e.touches);
    lastTouchMid = getTouchMid(e.touches);
  }
}, { passive: false });

viewport.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    originX = e.touches[0].clientX - startX;
    originY = e.touches[0].clientY - startY;
    applyTransform();
  } else if (e.touches.length === 2) {
    const newDist = getTouchDist(e.touches);
    const newMid = getTouchMid(e.touches);
    const zoomFactor = newDist / lastTouchDist;
    const newScale = Math.max(0.01, Math.min(scale * zoomFactor, 100000));

    const rect = viewport.getBoundingClientRect();
    const midX = newMid.x - rect.left;
    const midY = newMid.y - rect.top;

    originX = midX - (midX - originX) * (newScale / scale);
    originY = midY - (midY - originY) * (newScale / scale);
    scale = newScale;

    lastTouchDist = newDist;
    lastTouchMid = newMid;
    applyTransform();
  }
}, { passive: false });

viewport.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) {
    isDragging = false;
    lastTouchDist = null;
  }
});

// Pulsanti di controllo
document.getElementById('zoomIn').addEventListener('click', () => {
  const vw = viewport.clientWidth / 2;
  const vh = viewport.clientHeight / 2;
  const newScale = Math.min(scale * 1.3, 100000);
  originX = vw - (vw - originX) * (newScale / scale);
  originY = vh - (vh - originY) * (newScale / scale);
  scale = newScale;
  applyTransform();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  const vw = viewport.clientWidth / 2;
  const vh = viewport.clientHeight / 2;
  const newScale = Math.max(scale / 1.3, 0.01);
  originX = vw - (vw - originX) * (newScale / scale);
  originY = vh - (vh - originY) * (newScale / scale);
  scale = newScale;
  applyTransform();
});
document.getElementById('reset').addEventListener('click', centerImage);
</script>

</body>
</html>
